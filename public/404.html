<!doctype html>
<!-- Served for unknown paths by Cloudflare Pages, Netlify and Vercel (static 404.html). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found — IONA</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#070E14" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <style>
      @font-face { font-family: 'Satoshi'; font-weight: 300; font-style: normal; font-display: swap; src: url('/fonts/Satoshi-Light.woff2') format('woff2'); }
      @font-face { font-family: 'Satoshi'; font-weight: 400; font-style: normal; font-display: swap; src: url('/fonts/Satoshi-Regular.woff2') format('woff2'); }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #070e14; color: #f5f7f8; }
      body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; font-family: 'Satoshi', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
      /* the closing frame of the film: one ripple on black water */
      .backdrop { position: fixed; inset: 0; z-index: 0; background: #070e14 url('/stills/closing.webp') center 40% / cover no-repeat; opacity: 0.9; }
      .backdrop::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 46% 34% at 50% 46%, rgba(7, 14, 20, 0.62), rgba(7, 14, 20, 0.25) 70%, rgba(7, 14, 20, 0.55)); }
      :focus-visible { outline: 1px solid #d5e4ee; outline-offset: 3px; }
      a { color: inherit; text-decoration: none; }
      main { position: relative; z-index: 1; padding: 10vh 6vw; text-align: center; }
      .mark { margin: 0; font-size: 11px; font-weight: 400; letter-spacing: 0.34em; color: rgba(245, 247, 248, 0.84); }
      h1 { margin: 22px 0 0; font-size: clamp(40px, 6vw, 96px); font-weight: 300; letter-spacing: 0.46em; text-indent: 0.46em; line-height: 1; }
      .title { margin: 28px 0 0; font-size: clamp(13px, 1.25vw, 20px); letter-spacing: 0.42em; text-indent: 0.42em; text-transform: uppercase; }
      .text { max-width: 30rem; margin: 18px auto 0; font-size: 15px; line-height: 1.7; letter-spacing: 0.02em; color: rgba(245, 247, 248, 0.84); }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 44px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px; border: 1px solid rgba(245, 247, 248, 0.42); border-radius: 999px; font-size: 11px; font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; background: rgba(7, 14, 20, 0.38); transition: background-color 200ms cubic-bezier(0.23, 1, 0.32, 1), border-color 200ms cubic-bezier(0.23, 1, 0.32, 1), transform 160ms cubic-bezier(0.23, 1, 0.32, 1); touch-action: manipulation; }
      .btn--primary { background: #f5f7f8; border-color: #f5f7f8; color: #0b1220; }
      .btn:active { transform: scale(0.97); }
      .btn:focus-visible { border-color: #f5f7f8; }
      @media (hover: hover) and (pointer: fine) {
        .btn:hover { border-color: #f5f7f8; background: rgba(245, 247, 248, 0.12); }
        .btn--primary:hover { background: #d5e4ee; border-color: #d5e4ee; }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main>
      <p class="mark">Error 404</p>
      <h1 translate="no">IONA</h1>
      <p class="title">Page not found</p>
      <p class="text">The link may be old or mistyped. The film, and everything about the water, starts on the home page.</p>
      <div class="actions">
        <a class="btn btn--primary" href="/">Return to IONA</a>
        <a class="btn" href="/#contact">Contact</a>
      </div>
    </main>
  </body>
</html>
